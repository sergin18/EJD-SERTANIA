<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#65152b">
  <meta name="description" content="JD Sertânia">
  <title>JD Sertânia</title>
  <style>
    :root{
      --wine:#64162b;
      --wine-dark:#4b0f20;
      --wine-light:#7b2740;
      --cream:#fffaf7;
      --text:#21151a;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
    body{
      background:
        radial-gradient(circle at 50% 15%, rgba(255,255,255,.10), transparent 30%),
        linear-gradient(180deg,var(--wine) 0%,var(--wine-dark) 100%);
      color:var(--cream);
      display:flex;
      justify-content:center;
    }
    .page{
      width:min(100%,620px);
      min-height:100vh;
      padding:55px 22px 45px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    .brand{text-align:center;width:100%}
    .logo{
      width:128px;height:128px;border-radius:50%;
      margin:0 auto 27px;
      background:rgba(255,250,247,.96);
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 8px 30px rgba(0,0,0,.16);
    }
    .logo-mark{
      font-family:Georgia,serif;
      color:var(--wine);
      font-size:38px;
      font-weight:700;
      letter-spacing:-3px;
      line-height:1;
    }
    .logo-mark small{
      display:block;
      font-family:Arial,sans-serif;
      font-size:11px;
      letter-spacing:3px;
      margin-top:7px;
      text-align:center;
      font-weight:600;
    }
    h1{
      margin:0;
      font-size:24px;
      font-weight:600;
      letter-spacing:.3px;
    }
    .subtitle{
      margin:8px 0 42px;
      font-size:14px;
      opacity:.78;
      letter-spacing:.5px;
    }
    .links{
      width:100%;
      display:flex;
      flex-direction:column;
      gap:18px;
    }
    .link{
      min-height:76px;
      width:100%;
      border-radius:16px;
      background:var(--cream);
      color:var(--text);
      text-decoration:none;
      display:flex;
      align-items:center;
      padding:10px 20px;
      box-shadow:0 8px 22px rgba(0,0,0,.13);
      transition:transform .15s ease,box-shadow .15s ease;
    }
    .link:hover{
      transform:translateY(-2px);
      box-shadow:0 11px 27px rgba(0,0,0,.19);
    }
    .icon{
      width:54px;height:54px;border-radius:13px;
      background:var(--wine);
      display:grid;place-items:center;
      flex:none;
    }
    .icon svg{
      width:28px;height:28px;
      stroke:#fffaf7;fill:none;stroke-width:2;
    }
    .label{
      flex:1;
      text-align:center;
      font-size:18px;
      font-weight:600;
      padding-right:54px;
    }
    .footer{
      margin-top:auto;
      padding-top:60px;
      text-align:center;
      font-size:12px;
      opacity:.55;
    }
    @media(max-width:420px){
      .page{padding:42px 16px 32px}
      .logo{width:116px;height:116px}
      h1{font-size:22px}
      .subtitle{margin-bottom:35px}
      .link{min-height:72px;padding:9px 16px}
      .icon{width:52px;height:52px}
      .label{font-size:17px;padding-right:52px}
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="brand">
      <div class="logo" aria-label="Logo JD Sertânia">
        <div class="logo-mark">JD<small>SERTÂNIA</small></div>
      </div>
      <h1>JD Sertânia</h1>
      <div class="subtitle">Juventude Damas · Sertânia</div>
    </header>

    <section class="links">
      <!-- TROQUE OS DOIS LINKS ABAIXO PELOS LINKS REAIS -->
      <a class="link" href="https://instagram.com/SEU_INSTAGRAM" target="_blank" rel="noopener">
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="4" y="4" width="16" height="16" rx="5"/>
            <circle cx="12" cy="12" r="3.5"/>
            <circle cx="17.2" cy="6.8" r="1"/>
          </svg>
        </div>
        <div class="label">Instagram</div>
      </a>

      <a class="link" href="https://wa.me/SEU_NUMERO" target="_blank" rel="noopener">
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M20 11.5a8 8 0 0 1-11.9 7L4 20l1.5-4A8 8 0 1 1 20 11.5Z"/>
            <path d="M9 8.7c.2-.4.4-.4.7-.4h.5c.2 0 .4.1.5.4l.6 1.4c.1.2.1.4-.1.6l-.6.7c.7 1.3 1.5 2.1 2.8 2.8l.7-.6c.2-.2.4-.2.6-.1l1.4.6c.3.1.4.3.4.5v.5c0 .3 0 .5-.4.7-.4.2-1 .3-1.4.2-2.7-.7-5-3-5.7-5.7-.1-.4 0-1 .2-1.4Z"/>
          </svg>
        </div>
        <div class="label">WhatsApp</div>
      </a>
    </section>

    <div class="footer">JD Sertânia</div>
  </main>
</body>
</html>
